name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libboost-dev zlib1g-dev libaio-dev

      - name: Build (default flags, non-SPDK)
        run: make -j"$(nproc)"

      - name: Build (io_uring)
        run: make -j"$(nproc)" BUILD_URING=1

      - name: Unit tests
        run: make run_tests

  perf:
    name: performance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libboost-dev zlib1g-dev libaio-dev
          python3 -m pip install --quiet pytest numpy

      # The zero-copy invariant is measured inside a single run: the two KV
      # interfaces alternate over one store, so the drift that makes absolute
      # numbers useless on a shared runner cancels out of each pair. Runs on
      # every backend -- an invariant that holds on only one is not one.
      # timeout-minutes so a stalled backend fails fast instead of burning the
      # job limit -- io_uring on shared runners is the likely candidate.
      - name: Zero-copy invariant (AIO and io_uring)
        timeout-minutes: 25
        run: make -j"$(nproc)" BUILD_URING=1 run_perf_test

      - name: Python bindings build test
        run: make -j"$(nproc)" BUILD_URING=1 run_pyudepot_build_test

      # Reported, not asserted: raw I/O throughput on a shared runner is not
      # stable enough to gate on, but the numbers are useful in the log.
      - name: Raw I/O benchmarks (report only)
        continue-on-error: true
        run: make -C trt BUILD_URING=1 run_perf_test

  spdk:
    name: spdk (bdev)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libboost-dev zlib1g-dev libaio-dev \
            nasm libnuma-dev uuid-dev libssl-dev python3-pyelftools
          python3 -m pip install --quiet meson ninja

      - name: Build SPDK
        run: |
          cd trt/external/spdk
          ./configure --disable-unit-tests --disable-tests --without-nvme-cuse
          make -j"$(nproc)"

      - name: Build uDepot with SPDK
        run: make -j"$(nproc)" BUILD_SPDK=1 BUILD_URING=1

      # Build and environment smoke test only: these use SPDK's own event
      # framework and never touch trt::SPDK or SpdkQpair, so they do not cover
      # the TRT SPDK backend. See docs/TODO-spdk-testing.md.
      - name: SPDK bdev smoke test
        run: sudo -E make -C trt BUILD_SPDK=1 run_spdk_bdev_test

      - name: SPDK bdev perf (report only)
        continue-on-error: true
        run: sudo -E make -C trt BUILD_SPDK=1 run_spdk_bdev_perf
