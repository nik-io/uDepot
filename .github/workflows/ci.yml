name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libboost-dev zlib1g-dev libaio-dev ccache

      - name: ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-build-${{ github.sha }}
          restore-keys: ccache-build-

      - name: Build (default flags, non-SPDK)
        run: make -j"$(nproc)"

      - name: Build (io_uring)
        run: make -j"$(nproc)" BUILD_URING=1

      - name: Unit tests
        run: make run_tests

  perf:
    name: performance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libboost-dev zlib1g-dev libaio-dev
          python3 -m pip install --quiet pytest numpy

      # Zero-copy invariant via scripts/perf-zerocopy.sh: it drives udepot-test
      # in copy (--thin) vs zero-copy (--thin --zero-copy) mode, interleaved, per
      # backend, on a /dev/shm store, and fails if the zero-copy median is slower
      # on PUT or GET. The tmpfs store keeps both phases cache-bound so the
      # avoided memcpy is a real win; a small tolerance absorbs noise. Runs both
      # aio and io_uring -- an invariant that holds on only one is not one. Fast:
      # the earlier version used a separate bench that needed 150k+ ops and timed
      # out.
      - name: Zero-copy invariant (aio and io_uring)
        timeout-minutes: 20
        run: make -j"$(nproc)" BUILD_URING=1 run_perf_test

      - name: Python bindings build test
        run: make -j"$(nproc)" BUILD_URING=1 run_pyudepot_build_test

      # Reported, not asserted: raw I/O throughput on a shared runner is not
      # stable enough to gate on, but the numbers are useful in the log.
      - name: Raw I/O benchmarks (report only)
        continue-on-error: true
        run: make -C trt BUILD_URING=1 run_perf_test

  spdk:
    name: spdk (bdev)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libboost-dev zlib1g-dev libaio-dev ccache \
            nasm libnuma-dev uuid-dev libssl-dev python3-pyelftools
          python3 -m pip install --quiet meson ninja

      - name: ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-spdk-${{ github.sha }}
          restore-keys: ccache-spdk-

      - name: Build SPDK
        run: |
          cd trt/external/spdk
          ./configure --disable-unit-tests --disable-tests --without-nvme-cuse
          make -j"$(nproc)"

      - name: Build uDepot with SPDK
        run: make -j"$(nproc)" BUILD_SPDK=1 BUILD_URING=1

      # Build and environment smoke test only: these use SPDK's own event
      # framework and never touch trt::SPDK or SpdkQpair, so they do not cover
      # the TRT SPDK backend. See docs/TODO-spdk-testing.md.
      - name: SPDK bdev smoke test
        run: sudo -E make -C trt BUILD_SPDK=1 run_spdk_bdev_test

      - name: SPDK bdev perf (report only)
        continue-on-error: true
        run: sudo -E make -C trt BUILD_SPDK=1 run_spdk_bdev_perf

      # Actual coverage of the TRT SPDK backend: udepot-test's SPDK path (-u 7)
      # run as an NVMe-oF initiator against a loopback SPDK nvmf_tgt that exports
      # a RAM-backed malloc bdev as an NVMe namespace. No NVMe hardware needed.
      # Unlike the bdev smoke tests above, this drives trt::SPDK, SpdkQpair and
      # the TRT scheduler on the I/O path. See docs/TODO-spdk-testing.md.
      - name: SPDK NVMe-oF backend test (software target)
        timeout-minutes: 10
        # Match the build step's flags (BUILD_URING=1) so the build-config stamp
        # matches and nothing is rebuilt under different flags.
        run: sudo -E make BUILD_SPDK=1 BUILD_URING=1 run_spdk_nvmef_test
